  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const links = document.querySelectorAll("[data-page]");
      const content = document.getElementById("content");
    
      function loadPage(page) {
        fetch(page)
          .then(r => r.text())
          .then(html => {
            content.innerHTML = html;
            initAccordion(); // roda o accordion após injetar
          })
          .catch(()=>{ content.innerHTML = "<p>Erro ao carregar</p>"; });
      }
    
      links.forEach(link => {
        link.addEventListener("click", e => {
          e.preventDefault();
          loadPage(link.dataset.page);
        });
      });
    
      loadPage("pthome.html");
    });
    
    function initAccordion() {
      const root = document.getElementById('content') || document;
      const accordions = root.querySelectorAll('.accordion');
      const panels = root.querySelectorAll('.panel');
      if (!accordions.length) return;
      accordions.forEach((acc, i) => {
        const panel = panels[i];
        acc.onclick = () => {
          acc.classList.toggle('active');
          if (panel) panel.classList.toggle('active');
        };
      });
    }
    </script>
