  <script>
    const accordions = document.querySelectorAll('.accordion');
    const panels = document.querySelectorAll('.panel');
    
    accordions.forEach((accordion, index) => {
      const panel = panels[index];
      const title = panel.querySelector('.link-title');
      const titleText = title.textContent.trim();
    
      const dateMatch = titleText.match(/(\d{2})[\/\-](\d{2})[\/\-](\d{4})/);
      const linkMonth = dateMatch ? dateMatch[2] : null;
      const linkYear = dateMatch ? dateMatch[3] : null;
    
      const now = new Date();
      const currentMonth = String(now.getMonth() + 1).padStart(2, '0');
      const currentYear = String(now.getFullYear());
    
      if (linkMonth === currentMonth && linkYear === currentYear) {
        accordion.classList.add('active');
        panel.classList.add('active');
      }
    
      accordion.addEventListener('click', () => {
        accordion.classList.toggle('active');
        panel.classList.toggle('active');
      });
    });
  </script>
